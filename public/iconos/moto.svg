<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60" width="56" height="60">
  <!-- Sombra ovalada suave debajo de las llantas -->
  <ellipse cx="28" cy="56" rx="22" ry="3" fill="rgba(31,41,51,0.22)" />
  
  <!-- Llantas de la moto -->
  <circle cx="13" cy="46" r="8" fill="#1F2933" />
  <circle cx="13" cy="46" r="4.5" fill="#E3E7EC" />
  <circle cx="13" cy="46" r="2" fill="#1F2933" />

  <circle cx="43" cy="46" r="8" fill="#1F2933" />
  <circle cx="43" cy="46" r="4.5" fill="#E3E7EC" />
  <circle cx="43" cy="46" r="2" fill="#1F2933" />

  <!-- Chasis y guardabarros -->
  <path d="M11 40 Q20 38 29 42 L42 42" stroke="#003A73" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M29 42 L35 28 L41 33" stroke="#005198" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Tubo de escape -->
  <path d="M18 48 L8 47" stroke="#5B6670" stroke-width="2.5" stroke-linecap="round" />

  <!-- Faro delantero -->
  <polygon points="46,31 49,33 46,35" fill="#F28C1B" />

  <!-- Caja de domicilios (Naranja DomiRuta #F28C1B) en la parte trasera -->
  <rect x="5" y="21" width="18" height="18" rx="3" fill="#F28C1B" stroke="#003A73" stroke-width="1.5" />
  <text x="14" y="33" font-family="'Poppins', sans-serif" font-weight="700" font-size="6.5" fill="#1F2933" text-anchor="middle">DOMI</text>

  <!-- Conductor con casco DomiRuta -->
  <!-- Cuerpo / Chaqueta -->
  <path d="M25 38 L29 27 Q33 26 36 30 L32 38 Z" fill="#005198" />
  <!-- Brazo al manubrio -->
  <path d="M30 28 L38 32" stroke="#003A73" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cabeza / Casco -->
  <circle cx="32" cy="19" r="6" fill="#003A73" />
  <!-- Visor del casco mirando a la derecha -->
  <path d="M34 18 Q38 18 37 21" stroke="#F28C1B" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
