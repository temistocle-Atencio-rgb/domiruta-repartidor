<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60" width="56" height="60">
  <!-- Sombra ovalada suave debajo de las llantas -->
  <ellipse cx="28" cy="56" rx="22" ry="3" fill="rgba(31,41,51,0.22)" />
  
  <!-- Llantas de la moto (invertidas) -->
  <circle cx="43" cy="46" r="8" fill="#1F2933" />
  <circle cx="43" cy="46" r="4.5" fill="#E3E7EC" />
  <circle cx="43" cy="46" r="2" fill="#1F2933" />

  <circle cx="13" cy="46" r="8" fill="#1F2933" />
  <circle cx="13" cy="46" r="4.5" fill="#E3E7EC" />
  <circle cx="13" cy="46" r="2" fill="#1F2933" />

  <!-- Chasis y guardabarros -->
  <path d="M45 40 Q36 38 27 42 L14 42" stroke="#003A73" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M27 42 L21 28 L15 33" stroke="#005198" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Tubo de escape -->
  <path d="M38 48 L48 47" stroke="#5B6670" stroke-width="2.5" stroke-linecap="round" />

  <!-- Faro delantero hacia la izquierda -->
  <polygon points="10,31 7,33 10,35" fill="#F28C1B" />

  <!-- Caja de domicilios (Naranja DomiRuta #F28C1B) en la parte trasera (derecha), TEXTO AL DERECHO -->
  <rect x="33" y="21" width="18" height="18" rx="3" fill="#F28C1B" stroke="#003A73" stroke-width="1.5" />
  <text x="42" y="33" font-family="'Poppins', sans-serif" font-weight="700" font-size="6.5" fill="#1F2933" text-anchor="middle">DOMI</text>

  <!-- Conductor con casco DomiRuta mirando hacia la izquierda -->
  <!-- Cuerpo / Chaqueta -->
  <path d="M31 38 L27 27 Q23 26 20 30 L24 38 Z" fill="#005198" />
  <!-- Brazo al manubrio -->
  <path d="M26 28 L18 32" stroke="#003A73" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cabeza / Casco -->
  <circle cx="24" cy="19" r="6" fill="#003A73" />
  <!-- Visor del casco mirando a la izquierda -->
  <path d="M22 18 Q18 18 19 21" stroke="#F28C1B" stroke-width="2" fill="none" stroke-linecap="round" />
</svg>
